name: Microworld tick

# Advances the live microworld and publishes its state to the `microworld-data`
# branch — never to `main`, so this never touches the thesis repo's own versioning,
# changelog, or Pages build (pages.yml only triggers on pushes to `main`).
#
# First run after merging this file: trigger it once by hand (Actions tab ->
# this workflow -> "Run workflow") and read the log before trusting the schedule,
# especially the "create data branch if missing" step below.
#
# See infra/azure/README.md for why this runs here and not on Azure, and
# infra/microworld/tick.py's module docstring for what "tick" actually computes
# right now (a placeholder, not a reviewed model extension).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      scenario_json:
        description: >-
          Optional JSON object of scenario overrides to apply this run, e.g.
          {"capacity_fraction": 0.1}. See ALLOWED_SCENARIO_OVERRIDES in tick.py.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: microworld-tick
  cancel-in-progress: false

env:
  DATA_BRANCH: microworld-data

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch or create data branch worktree
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/${DATA_BRANCH}" > data-branch-ref.txt
          ref_status=$?
          set -e

          if [[ "${ref_status}" -eq 0 ]]; then
            git fetch --no-tags origin "+refs/heads/${DATA_BRANCH}:refs/remotes/origin/${DATA_BRANCH}"
            git worktree add state-branch "origin/${DATA_BRANCH}"
            git -C state-branch checkout -B "${DATA_BRANCH}"
          elif [[ "${ref_status}" -eq 2 ]]; then
            echo "Remote branch ${DATA_BRANCH} does not exist; initializing it."
            mkdir -p state-branch
            git -C state-branch init -q
            git -C state-branch checkout -q -b "${DATA_BRANCH}"
          else
            echo "Failed to check whether remote branch ${DATA_BRANCH} exists (git ls-remote exit ${ref_status})." >&2
            exit "${ref_status}"
          fi

      - name: Run tick
        env:
          SCENARIO_JSON: ${{ github.event.inputs.scenario_json }}
        run: |
          python3 infra/microworld/tick.py \
            --state-dir state-branch \
            --scenario-json "${SCENARIO_JSON}"

      - name: Write a single rolling root commit and force-push it
        working-directory: state-branch
        run: |
          set -euo pipefail
          git config user.name "microworld-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          tree_sha="$(git write-tree)"
          commit_sha="$(printf 'Tick %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | git commit-tree "${tree_sha}")"
          git push --force origin "${commit_sha}:refs/heads/${DATA_BRANCH}"
