name: Publish thesis lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version ledger
        run: pnpm version:check

      - name: Build public app
        run: pnpm build

      - name: Compile thesis PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: thesis

      - name: Copy research assets into Pages artifact
        run: |
          cp -R docs apps/web/dist/docs
          cp -R notebooks apps/web/dist/notebooks
          cp -R thesis apps/web/dist/thesis
          cp thesis/main.pdf apps/web/dist/thesis/master-thesis.pdf
          cp README.md apps/web/dist/README.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
