name: Publish thesis lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version ledger
        run: pnpm version:check

      - name: Check English and Spanish project parity
        run: pnpm language:check

      - name: Build public app
        run: pnpm build

      - name: Compile English primary thesis PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: thesis

      - name: Compile required Spanish thesis translation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: thesis/es

      - name: Verify bilingual thesis PDFs
        run: |
          test -s thesis/main.pdf
          test -s thesis/es/main.pdf

      - name: Copy research assets and final PDFs into Pages artifact
        run: |
          cp -R docs apps/web/dist/docs
          cp -R notebooks apps/web/dist/notebooks
          mkdir -p apps/web/dist/thesis
          cp thesis/main.pdf apps/web/dist/thesis/master-thesis.pdf
          cp thesis/es/main.pdf apps/web/dist/thesis/master-thesis.es.pdf
          cp README.md apps/web/dist/README.md
          cp README.es.md apps/web/dist/README.es.md
          cp VERSION_HISTORY.json apps/web/dist/VERSION_HISTORY.json
          cp VERSION_HISTORY.es.json apps/web/dist/VERSION_HISTORY.es.json

      - name: Verify Pages publishes PDFs only
        run: |
          test "$(find apps/web/dist/thesis -type f | wc -l)" -eq 2
          test -z "$(find apps/web/dist/thesis -type f -name '*.tex' -print -quit)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
